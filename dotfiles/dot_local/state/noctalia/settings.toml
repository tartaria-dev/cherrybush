config_version = 14

[audio]
enable_sounds = true

[backdrop]
blur_intensity = 0.89999997988343239
enabled = true

[bar]
order = [ "Main" ]

    [bar.Main]
    background_opacity = 0.89999997988343239
    capsule_radius = 7
    center = [ "workspaces" ]
    concave_edge_corners = false
    end = [ "tray", "network", "bluetooth", "battery", "control-center", "notifications", "clock" ]
    font_family = "Overpass ExtraBold"
    font_weight = 800
    margin_ends = 0
    radius = 0
    scale = 1.0500000081956387
    start = [ "launcher", "group:g1", "media" ]
    thickness = 36
    widget_spacing = 12

        [bar.Main.dead_zone.actions]
        right = "none"

        [[bar.Main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "cpu", "temp", "ram", "sysmon" ]
        opacity = 0.0
        padding = 6.0
        radius = 7.0
        widget_spacing = 6

[brightness]
enable_ddcutil = true

[control_center]
sidebar_section = "none"
width = 600

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 180.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 240.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 210.0

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.69999998435378075
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 846.0
    output = ""
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 288.0
    box_width = 688.0
    cx = 960.0
    cy = 444.0
    output = ""
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        font_family = "Adwaita Sans"
        shadow = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 32.0
    box_width = 160.0
    cx = 960.0
    cy = 332.0
    output = ""
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        center_text = true
        font_family = "Adwaita Sans"
        format = "%a %d"

[notification]
follow_focused_output = true
layer = "overlay"
max_visible = 2
offset_x = 9

[osd]
position = "bottom_center"

    [osd.kinds]
    media = false

[plugins]
enabled = []

[shell]
corner_radius_scale = 1.3500000201165676
font_family = "Overpass ExtraBold"
password_style = "random"
polkit_agent = true

    [shell.animation]
    speed = 1.6000000238418579

    [shell.launcher]
    categories = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 3.0
        enabled = true
        glyph = "lock-bolt"
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "suspend"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "5"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "6"
        variant = "destructive"

    [shell.shadow]
    direction = "center"

[theme]
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]

[wallpaper]
directory = "/usr/share/tartaria/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/usr/share/tartaria/wallpapers/cherry_tree.png"

    [wallpaper.last]
    path = "/usr/share/tartaria/wallpapers/cherry_tree.png"

[weather]
refresh_minutes = 10
unit = "imperial"

[widget.battery]
show_label = false

[widget.clock]
format = "{:%I:%M %p, %a %d}"
scale = 0.90000000000000002

[widget.control-center]
glyph = "settings"

[widget.cpu]
show_value = false

[widget.launcher]
glyph = "rocket"

[widget.media]
album_art_only = true

[widget.network]
show_label = false
vpn_status = "both"

[widget.ram]
show_value = false

[widget.sysmon]
show_value = false
stat = "disk_free_pct"

[widget.temp]
show_value = false

[widget.workspaces]
focused_output_only = true
style = "focus_hint"